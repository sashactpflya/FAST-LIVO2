fast_livo:
  ros__parameters:
    analysis:
      plot_time: -10.0
      frame_cnt: 6
      publish_sparse_depth_map: false
      publish_camera_fov_markers: false
      # Generate the images showing the patches projected in the image frame
      generate_projection_images: false
      reconstructed_view_levels:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      lidar_projection_en: false
      depth_discontinuity_overlay_on_depth_map: false
      publish_vio_optimization_points: false
      publish_vio_point_candidates: true
      publish_camera_intrinsics: false
      draw_camera_axes_on_rgb: true
      camera_intrinsics_every_n_vio_iters: 30
      publish_converged_points: false
    common:
      img_topic: "/alphasense/cam0/image_raw"
      lid_topic: "/hesai/pandar"
      imu_topic: "/alphasense/imu"
      img_en: 1
      lidar_en: 1
      ros_driver_bug_fix: false
      colorize_map_en: false
    extrin_calib: # In the IMU frame
      # Convention used:
      #
      # P_imu = R * P_frame + T
      # With R being the rotation from FRAME to IMU
      # And T being the position of FRAME origin expressed in IMU frame
      #
      # Except parameters defined initially, new parameters are written as such:
      #
      # P_target = R_target_source * P_source + T_target_source
      #
      # P_imu = R_imu_lidar * P_lidar + T_imu_lidar

      extrinsic_T: # Lidar frame origin in IMU frame
      - -0.001
      - -0.00855
      - 0.055
      extrinsic_R: # Lidar to IMU rotation as quaternion (qx, qy, qz, qw)
      - 0.7071068
      - -0.7071068
      - 0.0
      - 0.0

      # Direct Lidar to Camera transformation (row major)
      # P_camera = R_camera_lidar * P_lidar + T_camera_lidar
      R_camera_lidar: # Direct Lidar -> Camera (row major)
      - -0.999926
      - -0.00670802
      -  0.0101073
      - -0.0100912
      - -0.00242564
      - -0.999946
      -  0.00673218
      - -0.999975
      - 0.00235777
      T_camera_lidar: # Lidar position in Camera frame
      - -0.0549762
      - 0.0675401
      - -0.0520599
    intermediate_camera_extrinsics:
      use_intermediate_extrinsic: false
    time_offset:
      imu_time_offset: 0.0
      img_time_offset: 0.0
      exposure_time_init: 0.0
    preprocess:
      video_downsampler: 4 # Downsampling from 40Hz to 10Hz for images
      point_filter_num: 1
      filter_size_surf: 0.1
      lidar_type: 5
      scan_line: 32
      blind: 0.6
      feature_extract_enabled: false # <<<< FILL THIS FIELD
    vio:
      max_iterations: 5
      outlier_threshold: 500.0
      voxel_size: 0.4
      new_feature_min_translation: 0.5 # <<<< FILL THIS FIELD
      new_feature_min_rotation: 0.3 # <<<< FILL THIS FIELD
      new_feature_min_pixel_dist: 40.0 # <<<< FILL THIS FIELD
      img_point_cov: 1000.0
      patch_size: 8
      patch_pyrimid_level: 4
      normal_en: true
      orientation_check_en: false # <<<< FILL THIS FIELD
      max_view_angle: 80.0 # <<<< FILL THIS FIELD
      ncc_en: false
      ncc_outlier_threshold: 0.8
      raycast_en: false
      raycast_d_min: 0.1 # (Default)
      raycast_d_max: 3.0 # (Default)
      raycast_step: 0.2 # (Default)
      depth_discontinuity_threshold: 0.5
      inverse_composition_en: false
      exposure_estimate_en: true
      inv_expo_cov: 0.1
      grid_size: 1 # Set to value < 10 so it relies on default grid size
      enable_shi_tomasi_threshold: false
      min_shitomasi_score: 0.0
    imu:
      imu_en: true
      imu_int_frame: 30
      acc_cov: 0.5
      gyr_cov: 0.01
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
    lio:
      max_iterations: 5
      dept_err: 0.02
      beam_err: 0.05
      min_eigen_value: 0.0001
      voxel_size: 0.4
      max_layer: 2
      max_points_num: 100
      layer_init_num:
      - 5
      - 5
      - 5
      - 5
      - 5
    local_map:
      map_sliding_en: false
      half_map_size: 100
      sliding_thresh: 8.0
    uav:
      imu_rate_odom: false # Enable IMU propagation
      gravity_align_en: false
    publish:
      dense_map_en: false
      pub_effect_point_en: false
      pub_plane_en: false
      pub_rgb_img: true # <<<< FILL THIS FIELD
      publish_visible_voxels: false # <<<< FILL THIS FIELD
      pub_scan_num: 1
      blind_rgb_points: 0.00
    evo:
      seq_name: "exp11_lower_gallery"
      pose_output_en: true
    pcd_save:
      pcd_save_en: false
      colmap_output_en: false
      save_dense_map: false
      filter_size_pcd: 0.15
      interval: 100
