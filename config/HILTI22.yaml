fast_livo:
  ros__parameters:
    common:
      img_topic: "/alphasense/cam0/image_raw"
      lid_topic: "/hesai/pandar"
      imu_topic: "/alphasense/imu"
      img_en: 1
      lidar_en: 1
      ros_driver_bug_fix: false
      colorize_map_en: false
    extrin_calib:
      extrinsic_T:
      - -0.001
      - -0.00855
      - 0.055
      extrinsic_R: # Lidar to IMU quaternion (qx, qy, qz, qw)
      - 0.7071068
      - -0.7071068
      - 0.0
      - 0.0
      Rcl:
      - -0.999926
      - -0.00670802
      - 0.0101073
      - -0.0100912
      - -0.00242564
      - -0.999946
      - 0.00673218
      - -0.999975
      - 0.00235777
      Pcl:
      - -0.0549762
      - 0.0675401
      - -0.0520599
      use_intermediate_extrinsic: false
    time_offset:
      imu_time_offset: 0.0
      img_time_offset: 0.0
      exposure_time_init: 0.0
    preprocess:
      hilti_en: true
      point_filter_num: 1
      filter_size_surf: 0.1
      lidar_type: 5
      scan_line: 32
      blind: 0.6
    vio:
      max_iterations: 5
      outlier_threshold: 500.0
      img_point_cov: 1000.0
      patch_size: 8
      patch_pyrimid_level: 4
      normal_en: true
      ncc_en: false
      ncc_outlier_threshold: 0.8
      raycast_en: true
      inverse_composition_en: false
      exposure_estimate_en: true
      inv_expo_cov: 0.1
    imu:
      imu_en: true
      imu_int_frame: 30
      acc_cov: 0.5
      gyr_cov: 0.01
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
    lio:
      max_iterations: 5
      dept_err: 0.02
      beam_err: 0.05
      min_eigen_value: 0.0001
      voxel_size: 0.4
      max_layer: 2
      max_points_num: 100
      layer_init_num:
      - 5
      - 5
      - 5
      - 5
      - 5
    local_map:
      map_sliding_en: false
      half_map_size: 100
      sliding_thresh: 8.0
    uav:
      imu_rate_odom: true # Enable IMU propagation
      gravity_align_en: true
    publish:
      dense_map_en: true
      pub_effect_point_en: false
      pub_plane_en: false
      pub_scan_num: 1
      blind_rgb_points: 0.00
    evo:
      seq_name: "exp11_lower_gallery"
      pose_output_en: true
    pcd_save:
      pcd_save_en: true
      colmap_output_en: false
      save_dense_map: true
      filter_size_pcd: 0.15
      interval: -1
